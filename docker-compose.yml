version: '3.8'

services:

  # ─── BASE DE DATOS ───
  db-server:
    image: mariadb:10.11
    container_name: liga-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  # crea tablas al arrancar
      - liga_db_data:/var/lib/mysql                          # persiste los datos
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── BACKEND FLASK ───
  liga-backend:
    build: ./liga-backend
    container_name: liga-api
    restart: always
    environment:
      DB_HOST: db-server
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    ports:
      - "8000:8000"
    depends_on:
      db-server:
        condition: service_healthy   # espera a que MariaDB esté lista

  # ─── FRONTEND REACT ───
  liga-frontend:
    build: ./liga-futbol
    container_name: liga-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - liga-backend

volumes:
  liga_db_data:
